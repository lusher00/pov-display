vesc_port = /dev/serial0    # VESC UART device
vesc_baud = 115200    # VESC UART baud rate (VESC Tool: App Settings > UART)
motor_pole_pairs = 7    # Motor pole pairs (Flipsky 7070: 14 poles = 7)
belt_ratio = 2.115    # Motor rpm / rotor rpm (26T driver, 55T driven; measured 7000 eRPM -> 475 rotor rpm)
imu_bus = 1    # I2C bus number of the MPU-6050
imu_addr = 0x68    # MPU-6050 I2C address (0x68 or 0x69)
imu_range_g = 4    # Accelerometer full scale: 2, 4, 8 or 16 g
imu_axis = x    # Accelerometer axis in the rotor plane used for balancing: x, y or z (check with tools/mpu_watch.py once the GY-521 is bolted down)
opr_chip = /dev/gpiochip0    # GPIO chip for the once-per-rev sensor
opr_line = 4    # GPIO line (BCM number) of the once-per-rev sensor; -1 = not fitted (A3144 on GPIO4, pin 7)
opr_edge = falling    # Once-per-rev edge: rising or falling
opr_positions = 5    # Magnet positions round the gear (5 = one per spoke; 1 = single magnet)
opr_missing = 1    # Positions with no pulse (1 = one magnet fitted north-out to mark the index; 0 = none)
rpm_max = 2000.0    # Highest rotor rpm that can be commanded
rpm_start = 150.0    # Rotor rpm the ramp starts from (VESC sensorless start)
ramp_rate_rpm_s = 50.0    # Speed-up rate, rotor rpm per second
decel_rpm_s = 100.0    # Slow-down rate for stop and soft trips, rotor rpm per second
rpm_release = 120.0    # Below this rotor rpm a stopping rotor is released (motor current 0) to coast
keepalive_hz = 20.0    # Rate the rpm command is resent to the VESC (also its keepalive)
vib_1x_limit_g = 0.5    # Soft trip: once-per-rev vibration amplitude (g)
vib_rms_limit_g = 1.0    # Soft trip: broadband vibration RMS 2-200 Hz (g)
vib_hard_limit_g = 2.0    # Hard trip: broadband RMS (g) -> trip_hard_action
vib_nonsync_limit_g = 0.3    # Soft trip: largest non-synchronous peak (g), e.g. ground resonance or flutter
vib_growth_limit_s = 2.0    # Soft trip: non-synchronous peak growing by e (x2.7) in less than this many seconds
vib_1x_slope_limit = 3.0    # Hold the ramp: 1x amplitude rising faster than rpm^N (N = this); 2 = pure unbalance, larger = approaching a resonance
rpm_track_err_pct = 15.0    # Soft trip: rpm error vs command, percent
rpm_track_time_s = 2.0    # Soft trip: rpm error must persist this long
motor_current_limit_a = 40.0    # Soft trip: motor current (A)
temp_fet_limit_c = 80.0    # Soft trip: VESC MOSFET temperature (C)
temp_motor_limit_c = 90.0    # Soft trip: motor temperature (C), if the VESC has a sensor
sensor_timeout_s = 0.5    # Soft trip: VESC or IMU data older than this (s)
opr_timeout_revs = 3.0    # Soft trip: once-per-rev pulses missing for this many revolutions (only if opr_line set)
ui_deadman_s = 10.0    # Soft trip: no browser connected for this long while running (0 = off)
trip_action = ramp_down    # Soft trip action: ramp_down, coast or brake
trip_hard_action = coast    # Hard trip action: coast or brake
brake_current_a = 5.0    # Brake current for the brake action (A); check your supply can absorb regen
analysis_window_s = 2.0    # Length of vibration window for the 1x / RMS / spectrum estimate (s)
balance_settle_s = 5.0    # Wait after reaching balance_rpm before averaging (s)
balance_avg_s = 10.0    # Averaging time for each balance run (s)
balance_rpm = 800.0    # Rotor rpm for balance runs
balance_radius_mm = 100.0    # Radius at which trial and correction masses are fitted (mm)
balance_positions_deg =     # Angles where masses can be fitted, e.g. 0,90,180,270 (empty = any angle)
web_port = 8080    # Web UI port
log_dir = ~/povd-logs    # CSV run logs
